national_status_scale:
  0: UNKNOWN
  1: POLICY_ANNOUNCED
  2: RESPONSIBLE_AUTHORITY_IDENTIFIED
  3: BUDGET_FUNDING_IDENTIFIED
  4: MARKET_CONSULTATION
  5: PROCUREMENT_EXPECTED
  6: PROCUREMENT_OPEN
  7: AWARDED
  8: DEVELOPMENT
  9: CERTIFICATION
  10: PILOT
  11: PRODUCTION
  12: OPERATIONS_MAINTENANCE
