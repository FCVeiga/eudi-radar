# National Procurement Registry
#
# eudi_wallet_authority / wallet_name / wallet_status_raw / assurance_level /
# status_source below are populated from the iGrant.io EUDI Wallet Status
# Tracker (https://eudi-wallet-tracker.igrant.io/tracker/table), an
# actively maintained, source-cited, CC BY 4.0 dataset — last checked
# 2026-08-13 per the tracker's own "last updated" line.
#
# national_procurement_portal is confirmed real for 30/32 countries,
# researched primarily via the European Commission's own official
# "Public procurement in EU countries" directory page
# (commission.europa.eu/funding-and-tenders/tools-public-buyers/public-procurement-eu-countries_en),
# cross-checked against independent sources for several. Germany and
# Liechtenstein remain without one — both genuinely lack a single national
# portal, documented in their entries below.
#
# status_code is a heuristic mapping of the tracker's status label onto our
# 0-12 scale (see national_status_scale below) — approximate by nature.
# wallet_status_raw preserves the tracker's exact wording so you can judge
# the mapping yourself.

