untranslatable_acronyms:
  - EUDI
  - eIDAS
  - PID
  - QEAA
  - OpenID4VC
  - SD-JWT
  - mDL

false_positive_filter:
  suppress:
    - cryptocurrency wallets
    - Web3 wallets
    - consumer payment wallets
    - physical wallets
    - generic password managers
    - marketing announcements
    - generic IAM procurement
    - pure document scanning
    - pure cybersecurity
    - academic papers without funding
    - conference announcements without opportunity relevance
    - jobs
