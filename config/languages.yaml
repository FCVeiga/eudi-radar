# Local-language search terms, so the radar finds notices and news that never
# use the English phrasing. Used by:
#   - run_daily.py: TED full-text phrases (TED matches each notice's own language)
#   - agents/source_monitor.py: site searches of each country's portal and sites
#
# Each language lists the phrases a procurement notice or news story would
# actually use for the EUDI Wallet / digital identity wallet, plus electronic
# identification. "EUDI", "EUDIW" and "eIDAS" are the same in every language
# and are searched separately.

country_languages:
  AT: [de]
  BE: [nl, fr]
  BG: [bg]
  CH: [de, fr, it]
  CY: [el]
  CZ: [cs]
  DE: [de]
  DK: [da]
  EE: [et]
  ES: [es]
  FI: [fi, sv]
  FR: [fr]
  GR: [el]
  HR: [hr]
  HU: [hu]
  IE: [en]
  IS: [is]
  IT: [it]
  LI: [de]
  LT: [lt]
  LU: [fr, de]
  LV: [lv]
  MT: [en]
  NL: [nl]
  NO: ["no"]
  PL: [pl]
  PT: [pt]
  RO: [ro]
  SE: [sv]
  SI: [sl]
  SK: [sk]
  UK: [en]

